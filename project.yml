name: RPhoto
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: 18.0
  xcodeVersion: 26.1.1
  groupSortPosition: top
targets:
  RPhoto:
    type: application
    platform: iOS
    sources:
      - path: RPhoto
        excludes:
          - "*.xcodeproj"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RPhoto/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RPhoto
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: PhotosUI.framework
schemes:
  RPhoto:
    build:
      targets:
        RPhoto: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
